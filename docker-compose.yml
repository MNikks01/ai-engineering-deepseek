version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: chater-db
    environment:
      POSTGRES_USER: chater
      POSTGRES_PASSWORD: chater123
      POSTGRES_DB: chater
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: